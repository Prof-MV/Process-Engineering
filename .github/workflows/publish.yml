name: Build and Deploy Quarto Book

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Drop flaky preinstalled apt sources
        # The runner ships third-party apt sources (Google Chrome, Microsoft)
        # that this build never needs. They intermittently serve a mismatched
        # Packages index ("Hash Sum mismatch"), which makes the apt-get update
        # inside setup-r fail the whole job (exit 100). Delete any source file
        # -- whatever its name or format -- that points at those hosts.
        run: |
          ls -la /etc/apt/sources.list.d/ || true
          sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -vf
          ls -la /etc/apt/sources.list.d/

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown
            any::dplyr
            any::tidyr
            any::ggplot2
            any::ggrepel
            any::kableExtra
            any::stringr
            any::gridExtra
            any::ggforce

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render book (HTML, PDF, EPUB)
        run: quarto render

      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
          keep_files: false
