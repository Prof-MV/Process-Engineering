project:
  type: book
  output-dir: docs
  resources:
    - labs/handouts/

execute:
  freeze: auto

knitr:
  opts_chunk:
    results: hold

book:
  title: "Process Engineering"
  author: "Martin Volkening"
  date: today
  description: "Lecture notes accompanying the course."
  cover-image: images/Gemini_Generated_Image_dleggdleggdleggd.png
  site-url: https://prof-mv.github.io/Process-Engineering/
  repo-url: https://github.com/Prof-MV/Process-Engineering
  repo-actions: [edit, issue]
  # NOTE: the numeric filename prefixes (01-, 02- …) are historical and no
  # longer indicate reading order. The order below is the authoritative
  # sequence — it is aligned with the 14-week lab calendar so that every
  # lab's prerequisite chapter is taught before the lab runs (see 30-Labs.qmd,
  # "Course schedule", and index.qmd). Do NOT rename the files to match this
  # order: Quarto cross-references are label-based, so reordering this list is
  # safe and renaming only churns git history.
  chapters:
    - index.qmd
    - 01-Types-of-Manufacturing.qmd
    - 02-Process-and-Design.qmd
    - 08-Industrial-Robotics.qmd
    - 04-Plant-Layout.qmd
    - 16-AnyLogic-Simulation.qmd
    - 03-Integrated-Manufacturing-Systems.qmd
    - 05-Lean-Manufacturing.qmd
    - 07-Ergnomics.qmd
    - 06-Machine-Guarding-and-Safety.qmd
    - 10-SPC.qmd
    - 11-MSA.qmd
    - 20-Working-with-AI.qmd
    - 21-Machine-Learning.qmd
    - 12-TPM.qmd
    - 15-Troubleshooting-RCA.qmd
    - 09-Industrial-Automation.qmd
    - 13-Quality-Systems.qmd
    - 14-PFMEA.qmd
    - 30-Labs.qmd

bibliography: [references.bib, packages.bib]
link-citations: true

format:
  html:
    css: style.css
    toc: true
  pdf:
    documentclass: book
    pdf-engine: xelatex
    cite-method: natbib
    keep-tex: true
    toc: true
    number-sections: true
    include-in-header: preamble.tex
  epub:
    toc: true
