project:
  type: book
  output-dir: docs
  resources:
    - labs/handouts/
    - js/

execute:
  freeze: auto

knitr:
  opts_chunk:
    results: hold

book:
  title: "Process Engineering"
  author: "Martin Volkening and Anthropic's Claude Models"
  date: today
  description: "Lecture notes accompanying the course."
  cover-image: images/Gemini_Generated_Image_dleggdleggdleggd.png
  favicon: images/favicon.png
  site-url: https://prof-mv.github.io/Process-Engineering/
  repo-url: https://github.com/Prof-MV/Process-Engineering
  repo-actions: [edit, issue]
  # NOTE: the numeric filename prefixes match the chapter order below. The book
  # is in two parts: Part I (Process Engineering I) is chapters 1-15 and Part II
  # (Process Engineering II) is chapters 16-23. The order is aligned with the
  # 15-week lab calendar so that every lab's prerequisite chapter is taught
  # before the lab runs (see 23-Labs.qmd, "Course schedule", and index.qmd).
  # When reordering, rename the files (and _freeze/ folders) too.
  chapters:
    - index.qmd
    - part: "Process Engineering I"
      chapters:
        - 01-Types-of-Manufacturing.qmd
        - 02-Process-and-Design.qmd
        - 03-Industrial-Robotics.qmd
        - 04-Ergnomics.qmd
        - 05-MSA.qmd
        - 06-Metallurgy-Fundamentals.qmd
        - 07-Materials-Testing.qmd
        - 08-Plant-Layout.qmd
        - 09-SPC.qmd
        - 10-Working-with-AI.qmd
        - 11-Machine-Learning.qmd
        - 12-Machine-Guarding-and-Safety.qmd
        - 13-TPM.qmd
        - 14-PFMEA.qmd
        - 15-Lean-Manufacturing.qmd
    - part: "Process Engineering II"
      chapters:
        - 16-Quality-Systems.qmd
        - 17-Advanced-MSA.qmd
        - 18-Advanced-SPC.qmd
        - 19-AnyLogic-Simulation.qmd
        - 20-Integrated-Manufacturing-Systems.qmd
        - 21-Troubleshooting-RCA.qmd
        - 22-Industrial-Automation.qmd
        - 23-Labs.qmd

bibliography: [references.bib, packages.bib]
link-citations: true

format:
  html:
    css: style.css
    toc: true
  pdf:
    documentclass: book
    pdf-engine: xelatex
    cite-method: natbib
    keep-tex: true
    toc: true
    number-sections: true
    include-in-header: preamble.tex
  epub:
    toc: true
